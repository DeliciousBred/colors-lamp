name: CI

on:
  push:
    branches: [ "main", "CI-tests" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  biome-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Packages
        run: |
          npm install

      - name: Run Biome Lint Checking
        run: |
          npx biome lint .

  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: COP4331
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Packages
        run: |
          npm install jest jest-environment-jsdom

      - name: Initiate Database Schema
        run: |
          mysql -h 127.0.0.1 --user=root --password=root COP4331 < ./schema.sql
          mysql -h 127.0.0.1 --user=root --password=root COP4331 -e "insert into Users (FirstName,LastName,Login,Password) VALUES ('First','Last','Test','test');"
          mysql -h 127.0.0.1 --user=root --password=root COP4331 -e "SHOW DATABASES;"
          mysql -h 127.0.0.1 --user=root --password=root COP4331 -e "SHOW TABLES FROM COP4331;"
          mysql -h 127.0.0.1 --user=root --password=root COP4331 -e "SELECT * FROM COP4331.Users"
          

      - name: Host PHP Locally
        run: |
          php -S localhost:8000 -t ./public &
          sleep 5

      - name: Run Unit/Integration Testing
        run: |
          NODE_OPTIONS=--experimental-vm-modules npx jest
